version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fundsweb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundsweb
      POSTGRES_PASSWORD: fundsweb123
      POSTGRES_DB: fundsweb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
